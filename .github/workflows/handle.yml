name: Validate scores and publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate score data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate the student roster and scores
        run: python3 tools/validate_scores.py data/scores.csv data/students.csv

      - name: Check required website files
        run: |
          test -f site/index.html
          test -f site/student.html
          test -f site/assets/js/student.js
          test -f data/scores.csv
          test -f data/students.csv

  deploy:
    name: Publish GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public website
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/scores.csv data/students.csv _site/data/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
